<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="BrgyONE - Request and track your barangay documents online">
    <meta name="theme-color" content="#2563eb">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS Specific Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar" content="default">
    <meta name="apple-mobile-web-app-title" content="BrgyONE">
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
    <link rel="apple-touch-startup-image" href="icons/icon-512x512.png">

    <!-- Prevent iOS from auto-detecting phone numbers -->
    <meta name="format-detection" content="telephone=no">

    <title>BrgyONE - Barangay Document Request System</title>
    <link rel="stylesheet" href="css/styles.css?v=2026.03.12.001">
    <link rel="stylesheet" href="css/modern-enhancements.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container" style="display: none;">

        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section" id="logoBtn"
                    style="cursor: pointer; display: flex; align-items: center; gap: 4px;" title="Menu">
                    <img src="logo/BARANGAY.png" alt="Barangay One" style="height: 50px; width: auto;">
                </div>
                <div class="header-actions">
                    <button id="notificationBtn" class="icon-btn" aria-label="Notifications">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                    </button>
                    <button id="userMenuBtn" class="user-menu-btn" aria-label="User Menu">
                        <div class="user-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- User Menu Dropdown -->
        <div id="userMenu" class="dropdown-menu" style="display: none;">
            <div class="user-info">
                <div class="user-avatar-large">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="user-details">
                    <h3 id="userName">Guest</h3>
                    <p id="userRole">Resident</p>
                </div>
            </div>
            <div class="menu-divider"></div>
            <button class="menu-item" id="profileBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Profile
            </button>
            <button class="menu-item" id="adminSettingsBtn" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"></path>
                </svg>
                Barangay Settings
            </button>
            <button class="menu-item" id="settingsBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                Settings
            </button>
            <button class="menu-item" id="logoutBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
            <div class="menu-divider"></div>
            <div style="padding: var(--spacing-sm) var(--spacing-md); text-align: center;">
                <p style="margin: 0; font-size: var(--font-size-xs); color: var(--text-secondary);">
                    Version: <span id="appVersion">Loading...</span>
                </p>
            </div>
        </div>

        <!-- Navigation Menu Dropdown (Logo) -->
        <div id="navMenuDropdown" class="dropdown-menu"
            style="display: none; left: var(--spacing-md); right: auto; transform: none; top: 70px; overflow: visible;">
            <!-- Dropdown Pointer Indicator -->
            <div
                style="position: absolute; top: -6px; left: 32px; width: 12px; height: 12px; background: var(--bg-secondary); border-left: 1px solid var(--border-color); border-top: 1px solid var(--border-color); transform: rotate(45deg); border-top-left-radius: 2px;">
            </div>

            <!-- Wrapper to clip menu items -->
            <div style="border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-secondary);">
                <!-- Resident Links -->
                <div id="residentNavDropdown">
                    <button class="menu-item nav-dropdown-item" data-page="home">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        Dashboard
                    </button>
                    <button class="menu-item nav-dropdown-item" data-page="announcements">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0">
                            </path>
                        </svg>
                        Announcements
                    </button>
                    <button class="menu-item nav-dropdown-item" data-page="requests">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Requests
                    </button>
                    <button class="menu-item nav-dropdown-item" data-page="track">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        Track
                    </button>
                </div>

                <!-- Admin Links -->
                <div id="adminNavDropdown" style="display: none;">
                    <button class="menu-item nav-dropdown-item" data-page="admin-dashboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Dashboard
                    </button>
                    <button class="menu-item nav-dropdown-item" data-page="admin-announcements">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                        </svg>
                        Announcements
                    </button>
                    <!-- Inbox removed per request -->
                    <button class="menu-item nav-dropdown-item" data-page="admin-requests">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Requests
                    </button>
                    <button class="menu-item nav-dropdown-item" data-page="admin-reports">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Reports
                    </button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav" id="residentNav">
            <button class="nav-item active" data-page="home">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Dashboard</span>
            </button>
            <button class="nav-item" data-page="announcements">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Announcements</span>
            </button>
            <button class="nav-item scanner-nav-item" id="navScanBtn">
                <div class="scan-btn-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                        <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                        <rect x="7" y="7" width="10" height="10" />
                    </svg>
                </div>
                <span>Scan</span>
            </button>
            <button class="nav-item" data-page="requests">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Requests</span>
            </button>
            <button class="nav-item" data-page="track">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Track</span>
            </button>
        </nav>

        <!-- Admin Navigation -->
        <nav class="bottom-nav" id="adminNav" style="display: none;">
            <button class="nav-item active" data-page="admin-dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Dashboard</span>
            </button>
            <button class="nav-item" data-page="admin-announcements">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Announcements</span>
            </button>
            <!-- Scan ID center button -->
            <button class="nav-item scanner-nav-item" id="adminScanBtn">
                <div class="scan-btn-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                        <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                        <rect x="7" y="7" width="10" height="10" />
                    </svg>
                </div>
                <span>Scan ID</span>
            </button>
            <!-- Inbox removed per request -->
            <button class="nav-item" data-page="admin-requests">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>Requests</span>
            </button>
            <button class="nav-item" data-page="admin-reports">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Reports</span>

        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Pages will be loaded here dynamically -->
        </main>

        <!-- Toast Notification -->


        </div>

    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <!-- About Link -->
        <a href="about.html" class="info-link" title="About BrgyONE">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        </a>

        <!-- Municipality Logo -->
        <div class="logo-wrapper">
            <img src="logo/logo.jpg" alt="Municipality Logo" class="logo-swap">
            <img src="logo/pantukan.jpg" alt="Municipality Logo" class="logo-swap">
        </div>
        <div class="login-container">
            <div class="login-header">
                <img src="logo/BARANGAY.png" alt="Barangay One" class="login-brand-img">
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginUsername">Username or Email</label>
                    <input type="text" id="loginUsername" required placeholder="Enter username or email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" required placeholder="Enter your password">
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility('loginPassword', this)" tabindex="-1">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-secondary btn-block">Login</button>
            </form>
            <div class="login-footer">
                <p>Don't have an account? <a href="#" id="showRegister">Register</a></p>
            </div>
        </div>
    </div>

    <!-- Register Screen -->
    <div id="registerScreen" class="login-screen" style="display: none;">
        <div class="login-container">
            <div class="login-header">
                <img src="logo/BARANGAY.png" alt="Barangay One" class="login-brand-img" style="max-width: 200px;">
            </div>
            <form id="registerForm" class="login-form">
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="regFirstName">First Name</label>
                        <input type="text" id="regFirstName" required placeholder="Juan">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="regLastName">Last Name</label>
                        <input type="text" id="regLastName" required placeholder="Dela Cruz">
                    </div>
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone No.</label>
                    <input type="tel" id="regPhone" required placeholder="09123456789">
                </div>
                <div class="form-group">
                    <label for="regDOB">Date of birth</label>
                    <input type="date" id="regDOB" required>
                </div>
                <div class="form-group">
                    <label for="regGender">Gender</label>
                    <select id="regGender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="regAddress">Address</label>
                    <input type="text" id="regAddress" required placeholder="Barangay address">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="regPassword" required placeholder="Create a password">
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility('regPassword', this)" tabindex="-1">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="regConfirmPassword" required placeholder="Confirm your password">
                        <button type="button" class="password-toggle"
                            onclick="togglePasswordVisibility('regConfirmPassword', this)" tabindex="-1">

    <!-- Service Worker Registration & Version Manager -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered successfully:', registration.scope);

                        // Listen for updates to the service worker itself
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        console.log('SW Update found, forcing refresh...');
                                        forceAppUpdate();
                                    }
                                });
                            }
                        });
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // Active version manager: bypass caches to check server version.js
        function checkForUpdates() {
            if (!window.APP_VERSION) return;
            // Fetch version.js with timestamp query to bust browser cache
            fetch(`./js/version.js?t=${new Date().getTime()}`)
                .then(response => response.text())
                .then(text => {
                    const match = text.match(/const\s+APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
                    if (match && match[1]) {
                        const serverVersion = match[1];
                        if (serverVersion !== window.APP_VERSION) {
                            console.log(`Version mismatch! Current: ${window.APP_VERSION}, Server: ${serverVersion}`);
                            forceAppUpdate();
                        }
                    }
                })
                .catch(err => console.debug('Version check skipped or offline:', err));
        }

        function forceAppUpdate() {
            // Unregister service workers and clear caches
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                }).then(() => {
                    if (window.caches) {
                        caches.keys().then(names => {
                            for (let name of names) caches.delete(name);
                        });
                    }
                    // Hard reload to fetch new assets from server
                    window.location.reload(true);
                });
            } else {
                window.location.reload(true);
            }
        }

        // Trigger updates when tab regains focus or comes back online
        window.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdates();
        });
        window.addEventListener('online', checkForUpdates);

        // Initial check on load
        setTimeout(checkForUpdates, 3000);

        // Check occasionally while app is open (every 1 min)
        setInterval(checkForUpdates, 60000);

        // Display app version
        if (window.APP_VERSION) {
            const versionElement = document.getElementById('appVersion');
            if (versionElement) {
                versionElement.textContent = window.APP_VERSION;
            }
        }
    </script>
